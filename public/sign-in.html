<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Dashboard - Sign In</title>
    <style>
      /* =====================================================
         Standalone Host Environment
         Same values as src/css/host.css.
         ===================================================== */

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #010409;
        color: #c9d1d9;
        font-family: "Segoe UI", sans-serif;
      }

      /* =====================================================
         Sign-In Composition
         Centered horizontally and vertically.
         ===================================================== */

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* Uniform enlargement of the header branding. zoom scales
         every font size and spacing below by the same factor, so
         all relationships remain identical to the header. */
      .sign-in-branding {
        zoom: 2.5;
      }

      .sign-in-action {
        margin: 40px 0 0 0;
      }

      /* =====================================================
         Application Header Branding
         Copied verbatim from src/css/application.css - the
         application stylesheet is not served to signed-out
         users. Keep in sync with the application header.
         ===================================================== */

      .application-header-left {
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        min-width: 0;
        min-height: 0;
        gap: 8px;
        overflow: hidden;
      }

      .application-header-application-name {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        min-width: 0;
        gap: 0;
        white-space: nowrap;
      }

      .application-header-application-name-active {
        color: #8b949e;
        font-family: "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        user-select: none;
      }

      .application-header-application-name-manager {
        color: rgba(255, 255, 255, .92);
        font-family: "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        user-select: none;
      }

      .application-header-separator {
        flex: 0 0 auto;
        color: #6e7681;
        font-family: "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 400;
        white-space: nowrap;
        user-select: none;
      }

      .application-header-module-name {
        flex: 0 1 auto;
        min-width: 0;
        color: rgba(0, 255, 0, .40);
        font-family: "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 600;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        user-select: none;
      }

      /* =====================================================
         Selected Dashboard Tab
         Copied verbatim from src/css/tabs.css (tab, hover,
         selected). Keep in sync with the application tabs.
         ===================================================== */

      .project-dashboard-tabs-tab {
        display: flex;
        flex: 0 0 120px;
        width: 120px;
        height: 32px;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 10px;
        box-sizing: border-box;
        text-align: left;
        border: 1px solid rgba(0, 255, 0, .10);
        border-bottom: 0;
        border-radius: 6px 6px 0 0;
        color: rgba(225, 255, 225, .85);
        background: rgba(0, 255, 0, .05);
        font: inherit;
        cursor: pointer;
      }

      .project-dashboard-tabs-tab:hover {
        background: rgba(0, 255, 0, .10);
        border-color: rgba(0, 255, 0, .18);
        color: rgba(235, 255, 235, .95);
      }

      .project-dashboard-tabs-tab-selected {
        background: rgba(0, 255, 0, .15);
        border-color: rgba(0, 255, 0, .25);
        color: rgba(235, 255, 235, 1);
      }
    </style>
  </head>
  <body>
    <!-- Standalone host page - served by staticwebapp.config.json (401 override). -->
    <div class="sign-in-branding">
      <div class="application-header-left">
        <div class="application-header-application-name"><span class="application-header-application-name-active">Active</span><span class="application-header-application-name-manager">Manager</span></div>
        <span class="application-header-separator">|</span>
        <span class="application-header-module-name">project dashboard</span>
      </div>
    </div>
    <form class="sign-in-action" method="get" action="/.auth/login/aad">
      <button type="submit" class="project-dashboard-tabs-tab project-dashboard-tabs-tab-selected">Sign in</button>
    </form>
  </body>
</html>
