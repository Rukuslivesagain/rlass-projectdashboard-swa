<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Dashboard - Access Request Required</title>
    <link rel="stylesheet" href="/request-access.css" />
  </head>
  <body>
    <!-- Standalone host page - served by staticwebapp.config.json (403 override). -->
    <div class="request-access-composition">
      <div class="request-access-body">
        <div class="request-access-brand">
          <div class="request-access-brand-name"><span class="request-access-brand-active">Active</span><span class="request-access-brand-manager">Manager</span></div>
          <span class="request-access-brand-separator">|</span>
          <span class="request-access-brand-module">project dashboard</span>
        </div>
      </div>
      <!-- Request Access is visual only: no form, no handler, no request. Request workflow is a future pass. -->
      <div class="request-access-footer-1">
        <input type="email" id="request-access-email" class="request-access-email" value="" aria-label="Signed-in email" disabled />
        <button type="button" class="request-access-request">Request Access</button>
        <a class="request-access-sign-out" href="/.auth/logout">Sign out</a>
      </div>
      <div class="request-access-status-row">
        <span class="request-access-status">User access keys not found!</span>
      </div>
    </div>
    <script>
      // Supplementary identity for the future access request.
      // Page-local only (never displayed, not persisted). Filled
      // from the same /.auth/me lookup below; the server treats
      // these values as untrusted metadata.
      const requestAccessIdentity = {
        userDisplayName: "",
        tenantId: "",
        objectId: ""
      };

      // Display only: show the signed-in SWA identity. Reads
      // /.auth/me (same origin); leaves the field blank if the
      // identity cannot be resolved. No other requests.
      (async function () {
        const field = document.getElementById("request-access-email");
        try {
          const response = await fetch("/.auth/me", { cache: "no-store" });
          const contentType = response.headers.get("content-type") || "";
          if (!response.ok || !contentType.includes("application/json")) {
            return;
          }
          const authContext = await response.json();
          const userDetails = authContext && authContext.clientPrincipal && authContext.clientPrincipal.userDetails;
          if (typeof userDetails === "string") {
            field.value = userDetails.trim();
          }
          const claims = (authContext && authContext.clientPrincipal && authContext.clientPrincipal.claims) || [];
          const claimValue = function (type) {
            const claim = Array.isArray(claims) ? claims.find(function (c) { return c && c.typ === type; }) : null;
            return claim && typeof claim.val === "string" ? claim.val.trim() : "";
          };
          requestAccessIdentity.userDisplayName = claimValue("name");
          requestAccessIdentity.objectId = claimValue("http://schemas.microsoft.com/identity/claims/objectidentifier");
          requestAccessIdentity.tenantId = claimValue("http://schemas.microsoft.com/identity/claims/tenantid");
        } catch (error) {
          // Leave the field blank.
        }
      })();
    </script>
  </body>
</html>
