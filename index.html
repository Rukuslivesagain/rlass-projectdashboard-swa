<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project Dashboard</title>

    <link
        rel="manifest"
        href="/manifest.json"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background:
                #111111;

            color:
                #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        #app {
            display: flex;

            width: 100%;
            height: 100%;

            align-items: center;
            justify-content: center;
        }

        #testPanel {
            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 12px;
        }

        #testTitle {
            margin: 0;

            font-size: 28px;
            font-weight: 600;
        }

        #testStatus {
            margin: 0;

            font-size: 14px;

            opacity: .75;
        }
    </style>
</head>

<body>

    <div id="app">

        <div id="testPanel">

            <h1 id="testTitle">
                Project Dashboard
            </h1>

            <p id="testStatus">
                Standalone SWA Test
            </p>

        </div>

    </div>

    <script>

        // =====================================================
        // Project Dashboard
        // Standalone SWA Host Test
        // =====================================================

        const app =
            document.getElementById(
                "app"
            );

        if (
            !app
        ) {

            throw new Error(
                "Project Dashboard application root was not found."
            );

        }

        console.log(
            "[ProjectDashboard] Standalone SWA host loaded."
        );

    </script>

</body>

</html>
