<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Project Dashboard</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #appFrame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="appFrame"></iframe>

    <script>
        const frame = document.getElementById('appFrame');

        let prodUrl = "https://apps.powerapps.com/play/e/b2613665-d84f-edad-9db0-c38027810715"
                    + "/a/984ef919-843b-4371-8ceb-9245a568f7a0"
                    + "?tenantId=5e93c790-e27b-42b1-b915-82f7d02fe1e1"
                    + "&hint=0963fea6-a926-4f2c-a78a-8f476c4f950e"
                    + "&hidenavbar=true"
                    + "&source=iframe"
                    + "&launcher=prodportal"
                    + "&hostDomain=" + encodeURIComponent(window.location.hostname);

        frame.src = prodUrl;

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js")
                    .then(() => console.log("Service Worker Registered"))
                    .catch(err => console.log(err));
            });
        }
    </script>

</body>
</html>
