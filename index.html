<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project Dashboard</title>

    <meta
        name="theme-color"
        content="#111111"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111111;
            color: #ffffff;

            font-family:
                Arial,
                sans-serif;
        }

        body {
            display: flex;

            align-items: center;
            justify-content: center;
        }

        #ctrMain {
            display: flex;
            flex-direction: column;

            width: 700px;
            max-width: calc(100% - 40px);

            padding: 32px;

            box-sizing: border-box;

            background: #161b22;

            border:
                1px solid rgba(255, 255, 255, 0.15);

            border-radius: 8px;
        }

        #txtTitle {
            margin: 0 0 24px 0;

            font-size: 28px;
            font-weight: 600;
        }

        #txtStatus {
            margin-bottom: 16px;

            color: rgba(255, 255, 255, 0.70);
        }

        #ctrUser {
            display: none;

            padding: 16px;

            background: #0d1117;

            border:
                1px solid rgba(255, 255, 255, 0.10);

            border-radius: 4px;
        }

        #txtUserLabel {
            margin-bottom: 8px;

            color: rgba(255, 255, 255, 0.60);

            font-size: 13px;
        }

        #txtUserEmail {
            font-size: 18px;
            font-weight: 500;
        }

    </style>

</head>

<body>

    <div id="ctrMain">

        <h1 id="txtTitle">
            Project Dashboard
        </h1>

        <div id="txtStatus">
            Checking authentication...
        </div>

        <div id="ctrUser">

            <div id="txtUserLabel">
                Authenticated User
            </div>

            <div id="txtUserEmail">
            </div>

        </div>

    </div>

    <script>

        // =====================================================
        // Resolve Authentication Context
        // =====================================================

        async function processResolveAuthenticationContext() {

            const txtStatus =
                document.getElementById(
                    "txtStatus"
                );

            const ctrUser =
                document.getElementById(
                    "ctrUser"
                );

            const txtUserEmail =
                document.getElementById(
                    "txtUserEmail"
                );

            try {

                // =====================================================
                // Retrieve SWA Authentication Context
                // =====================================================

                const response =
                    await fetch(
                        "/.auth/me",
                        {
                            method:
                                "GET",

                            credentials:
                                "include",

                            cache:
                                "no-store"
                        }
                    );

                if (
                    !response.ok
                ) {

                    throw new Error(
                        `Authentication request failed: ${response.status} ${response.statusText}`
                    );

                }

                const authenticationContext =
                    await response.json();

                const clientPrincipal =
                    authenticationContext.clientPrincipal;

                // =====================================================
                // Authentication Required
                // =====================================================

                if (
                    !clientPrincipal ||
                    !clientPrincipal.userDetails
                ) {

                    txtStatus.textContent =
                        "Authentication required. Redirecting...";

                    const returnUrl =
                        window.location.origin +
                        window.location.pathname;

                    window.location.href =
                        "/.auth/login/aad" +
                        "?post_login_redirect_uri=" +
                        encodeURIComponent(
                            returnUrl
                        );

                    return;

                }

                // =====================================================
                // Resolve Authenticated User
                // =====================================================

                const userEmail =
                    clientPrincipal.userDetails
                        .toLowerCase();

                // =====================================================
                // Display Authenticated User
                // =====================================================

                txtStatus.textContent =
                    "Authentication successful.";

                txtUserEmail.textContent =
                    userEmail;

                ctrUser.style.display =
                    "block";

                // =====================================================
                // Development Logging
                // =====================================================

                console.log(
                    "[ProjectDashboard] Authentication Context:",
                    authenticationContext
                );

                console.log(
                    "[ProjectDashboard] Authenticated User:",
                    userEmail
                );

            }
            catch (
                error
            ) {

                // =====================================================
                // Authentication Failure
                // =====================================================

                console.error(
                    "[ProjectDashboard] Authentication Error:",
                    error
                );

                txtStatus.textContent =
                    "Unable to retrieve authentication information.";

            }

        }


        // =====================================================
        // Application Startup
        // =====================================================

        processResolveAuthenticationContext();

    </script>

</body>

</html>
